<main class="p">
  <button type="button" class="back-button"  (click)="back()" ><img src="image/back.svg" alt=""></button>
  <div class="con">
    <div class="page">
    <div class="page-heading">
    
    <h1>Profile</h1>
  </div>

  <div class="profile-card">
     <div class="edit-profile-banner">Edit Profile</div>
    <div class="profile-card__top">
      <img class="profile-avatar" [src]="profile" />
       <div class="sku_pro2">
    <label class="label_import">Upload Image</label>
    <div class="con_edit">
        <input type="text" 
               class="sku_input2" 
               [(ngModel)]="profile"
               placeholder="Or Attach link">
    </div>
</div>
      <!-- Role ห้ามแก้ไข ใช้ span เหมือนเดิม -->
      <div class="profile-field">Role<span class="role">{{ userRole }}</span></div>
    </div>

    <div class="profile-grid">
      <div class="profile-field">Full Name
        <input type="text" class="profile-field__value" style="border: none; background: transparent; width: 100%;" [(ngModel)]="username">
      </div>
      <div class="profile-field">Date of Birth
        <input type="date" class="profile-field__value" style="border: none; background: transparent; width: 100%;" [(ngModel)]="dob">
      </div>
      <div class="profile-field">National ID Number
        <input type="text" class="profile-field__value" style="border: none; background: transparent; width: 100%;" [(ngModel)]="nationalId">
      </div>
    </div>

    <div class="profile-field">Current Address
      <textarea class="profile-field__value profile-field__value--area" style="border: none; background: transparent; width: 100%; resize: none;" [(ngModel)]="address"></textarea>
    </div>
    <div class="profile-field">Emergency Contact
      <textarea class="profile-field__value profile-field__value--area" style="border: none; background: transparent; width: 100%; resize: none;" [(ngModel)]="emergencyContact"></textarea>
    </div>
  </div>
  </div>
       <div class="button_import">                 
            <div class="save" (click)="saveProfile()" istyle="cursor: pointer;">Save</div>                 
            <div class="cancel"  (click)="button_cancels()"  style="cursor: pointer;">Cancel</div>             
        </div>     
  </div>
  
</main>
