<div class="container">
  <div class="navbar">

    <div class="header">
      Email OTP Verification
    </div>
    <div class="subheader">
      OTP sent to <strong>{{ userData.title || 'your Email Address' }}</strong>
    </div>

    <div class="input-group">
      <input #d1 type="text" maxlength="1" inputmode="numeric" 
             [(ngModel)]="otpDigits[0]" 
             (input)="onDigitInput($event, 0, d2)" 
             (keydown)="onKeyDown($event, 0, null)"> 
             
      <input #d2 type="text" maxlength="1" inputmode="numeric" 
             [(ngModel)]="otpDigits[1]" 
             (input)="onDigitInput($event, 1, d3)" 
             (keydown)="onKeyDown($event, 1, d1)"> 
             
      <input #d3 type="text" maxlength="1" inputmode="numeric" 
             [(ngModel)]="otpDigits[2]" 
             (input)="onDigitInput($event, 2, d4)" 
             (keydown)="onKeyDown($event, 2, d2)"> 
             
      <input #d4 type="text" maxlength="1" inputmode="numeric" 
             [(ngModel)]="otpDigits[3]" 
             (input)="onDigitInput($event, 3, null)" 
             (keydown)="onKeyDown($event, 3, d3)"> 
    </div>

    <!-- แสดง Error กรณีรหัสผิดหรือหมดอายุ -->
    <div *ngIf="errorMessage" style="color: #ff4d4d; margin-top: 10px; font-size: 14px; text-align: center;">
      {{ errorMessage }}
    </div>

    <div class="hero">
      <div class="countdown">
        <img src="/image/clock.svg" class="clock" alt="">
        {{ timerText }} s
      </div>

      <!-- ปุ่มขอรหัสใหม่ -->
      <div class="return">
        Didn't get the OTP? 
        <a href="javascript:void(0)" class="login" 
           (click)="resendOtp()" 
           [style.pointer-events]="timeLeft > 295 ? 'none' : 'auto'"
           [style.opacity]="timeLeft > 295 ? '0.5' : '1'">
           Resend OTP
        </a>
      </div>

      <!-- ปุ่มยืนยันและส่งสมัครสมาชิก -->
      <div class="sihg">
        <button class="button" (click)="submitRegister()" [disabled]="isLoading">
          {{ isLoading ? 'Processing...' : 'Verify & Proceed' }}
        </button>
      </div>
    </div>

  </div>
</div>

<div class="ferni"></div>
<div class="ferni2"></div>
<div class="ferni3"></div>
<div class="ferniback"></div>

<div *ngIf="showpopup" class="backpop">
  <div *ngIf="showpopup" class="popupcontainer">
  <div class="popup-content">
    <img class="iconsuccess" src="image/success.svg" alt="">
    <div class="headerpop">
      Success
    </div>
    <div class="subheadersuccess">
      {{popup}}
    </div>
    <button class="buttonclose" (click)="closepopup()">OK</button>
  </div>
</div>
</div>

<div *ngIf="showpopupnoti" class="backpop">
  <div *ngIf="showpopupnoti" class="popupcontainer">
  <div class="popup-content">
    <img class="iconsuccess" src="image/cross.svg" alt="">
    <div class="headerpop">
      Something went Wrong
    </div>
    <div class="subheadersuccess">
      {{popup}}
    </div>
    <button class="buttonnoti" (click)="closepopup()">OK</button>
  </div>
</div>
</div>
